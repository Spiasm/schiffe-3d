plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'de.spiasm.schiffe3d'
    compileSdk 35

    defaultConfig {
        applicationId "de.spiasm.schiffe3d"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    signingConfigs {
        fixed {
            // Schlüssel liegt verschlüsselt im Projekt; das Passwort steht geheim bei GitHub (Secret KEYSTORE_PASS)
            storeFile file('release.keystore')
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias 'app'
            keyPassword System.getenv('KEYSTORE_PASS')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
